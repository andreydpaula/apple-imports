<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrey Almeida — Portfólio</title>
<meta name="description" content="Portfólio profissional de Andrey Almeida: projetos, experiência e contato.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--line:#222230;--ink:#ececf1;--mut:#8b8b9c;--acc:#5eead4;
--head:"Outfit",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif;--w:1080px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(900px 500px at 85% -5%,rgba(94,234,212,.07),transparent 60%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,56px 56px,56px 56px}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--w);margin:auto;padding:0 24px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.025em;line-height:1.1}
[hidden]{display:none!important}

nav{position:fixed;inset:0 0 auto;z-index:10;transition:background .3s,border-color .3s,backdrop-filter .3s;border-bottom:1px solid transparent}
nav.scrolled{background:rgba(10,10,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;height:68px}
.brand{font:600 18px var(--head);letter-spacing:-.02em}.brand i{color:var(--acc);font-style:normal}
.links{display:flex;gap:28px;font-size:15px;color:var(--mut)}
.links a{transition:color .2s}.links a:hover{color:var(--ink)}

.hero{min-height:100svh;display:flex;align-items:center;padding:120px 0 80px}
.eyebrow{font:500 13px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:22px;display:flex;gap:12px;align-items:center}
.eyebrow::before{content:"";width:32px;height:1px;background:var(--acc)}
.hero h1{font-size:clamp(44px,9vw,96px);font-weight:600;max-width:11ch}
.hero p.lead{margin:28px 0 38px;max-width:560px;font-size:19px;color:var(--mut)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:10px;font:500 15px var(--head);border:1px solid var(--line);color:var(--ink);transition:transform .2s,border-color .2s,background .2s,color .2s}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn:hover{border-color:var(--acc);transform:translateY(-2px)}
.btn.main{background:var(--acc);color:#04201c;border-color:var(--acc);font-weight:600}.btn.main:hover{background:#8ff3e3}

section.blk{padding:100px 0}
.sh{display:flex;align-items:baseline;gap:16px;margin-bottom:44px}
.sh span{font:500 13px var(--head);color:var(--acc);letter-spacing:.1em}
.sh h2{font-size:clamp(30px,5vw,44px);font-weight:600}
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:56px}
.about p{color:#c4c4d0;margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tag{font:500 13px var(--head);padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:#c4c4d0;background:var(--surface);transition:border-color .2s,color .2s}
.tag:hover{border-color:var(--acc);color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}
.card{--lc:var(--acc);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);border-color:var(--lc);box-shadow:0 18px 50px -20px var(--lc)}
.cover{height:130px;position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--lc) 22%,var(--surface)),var(--surface) 75%);border-bottom:1px solid var(--line)}
.cover b{position:absolute;right:20px;bottom:-18px;font:700 92px/1 var(--head);color:var(--lc);opacity:.22;letter-spacing:-.06em}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px)}
.cover em{position:absolute;left:22px;top:20px;font:500 12px var(--head);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--lc);display:flex;align-items:center;gap:8px;z-index:1}
.cover em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lc)}
.cbody{padding:24px;display:flex;flex-direction:column;gap:14px;flex:1}
.card h3{font-size:23px;font-weight:600}
.card p{color:var(--mut);font-size:16px;flex:1}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{font-size:12.5px;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--lc) 12%,transparent);color:var(--lc);font-weight:600}
.clinks{display:flex;gap:18px;font:500 14px var(--head);padding-top:6px}
.clinks a{display:inline-flex;gap:6px;align-items:center;color:var(--ink);transition:color .2s}.clinks a:hover{color:var(--lc)}
.clinks svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.tl{border-left:1px solid var(--line);margin-left:6px}
.job{position:relative;padding:0 0 38px 34px}
.job::before{content:"";position:absolute;left:-6px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.job small{font:500 13px var(--head);color:var(--acc);letter-spacing:.06em}
.job h3{font-size:22px;margin:6px 0 2px;font-weight:600}.job .co{color:#c4c4d0}.job p{color:var(--mut);margin-top:8px;max-width:640px}

footer{padding:110px 0 40px;border-top:1px solid var(--line);margin-top:60px}
footer h2{font-size:clamp(34px,6vw,60px);font-weight:600;max-width:15ch;margin-bottom:20px}
footer p{color:var(--mut);max-width:480px;margin-bottom:32px}
.copy{margin-top:90px;font-size:14px;color:var(--mut)}

.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:760px){.links{gap:18px;font-size:14px}.about{grid-template-columns:1fr;gap:32px}section.blk{padding:70px 0}.brand{display:none}.nav{justify-content:center}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.card,.btn{transition:none}}
</style>
</head>
<body>

<nav id="nav"><div class="wrap nav">
  <a class="brand" href="#top" id="brand"></a>
  <div class="links"><a href="#sobre" data-s="sobre">Sobre</a><a href="#projetos">Projetos</a><a href="#experiencia" data-s="experiencia">Experiência</a><a href="#contato">Contato</a></div>
</div></nav>

<main id="top">
  <header class="hero"><div class="wrap">
    <div class="eyebrow rv" id="role"></div>
    <h1 class="rv" id="name"></h1>
    <p class="lead rv" id="summary"></p>
    <div class="cta rv">
      <a class="btn main" href="#projetos">Ver projetos</a>
      <a class="btn" id="b-in" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><use href="#i-in"/></svg>LinkedIn</a>
      <a class="btn" id="b-gh" target="_blank" rel="noopener"><svg viewBox="0 0 16 16"><use href="#i-gh"/></svg>GitHub</a>
    </div>
  </div></header>

  <section class="blk" id="sobre"><div class="wrap">
    <div class="sh rv"><span>01</span><h2>Sobre mim</h2></div>
    <div class="about rv"><div id="about"></div><div class="tags" id="skills"></div></div>
  </div></section>

  <section class="blk" id="projetos"><div class="wrap">
    <div class="sh rv"><span>02</span><h2>Projetos</h2></div>
    <div class="grid" id="projects"></div>
  </div></section>

  <section class="blk" id="experiencia"><div class="wrap">
    <div class="sh rv"><span>03</span><h2>Experiência</h2></div>
    <div class="tl" id="jobs"></div>
  </div></section>
</main>

<footer id="contato"><div class="wrap">
  <h2 class="rv">Vamos conversar sobre o próximo projeto.</h2>
  <p class="rv">Estou aberto a oportunidades, parcerias e trocas de ideias. Fale comigo pelos canais abaixo.</p>
  <div class="cta rv">
    <a class="btn" id="f-in" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><use href="#i-in"/></svg>LinkedIn</a>
    <a class="btn" id="f-gh" target="_blank" rel="noopener"><svg viewBox="0 0 16 16"><use href="#i-gh"/></svg>GitHub</a>
    <a class="btn main" id="f-mail" hidden>Enviar e-mail</a>
  </div>
  <div class="copy" id="copy"></div>
</div></footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></symbol>
  <symbol id="i-gh" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
</svg>

<script>
/* ============ EDITE AQUI: todo o conteúdo da página vem deste bloco ============
   Seções vazias (sobre, habilidades, experiência) ficam ocultas automaticamente. */
const CONFIG = {
  name: "Andrey Almeida",
  role: "Portfólio profissional",              // ex.: "Engenheiro de Dados"
  summary: "Bem-vindo ao meu portfólio. Aqui você encontra meus projetos e as melhores formas de entrar em contato.",
  about: [],                                   // ex.: ["Parágrafo 1...", "Parágrafo 2..."]
  skills: [],                                  // ex.: ["Python", "SQL", "Airflow", "Docker"]
  email: "",                                   // ex.: "voce@email.com"
  linkedin: "https://www.linkedin.com/in/andrey-almeida-8aa672450/",
  github: "https://github.com/andreydpaula",
  projects: [
    {
      name: "landing-pagename",
      description: "Landing page publicada com GitHub Pages. Edite esta descrição para explicar o que o projeto faz e qual problema resolve.",
      lang: "HTML",
      stack: ["HTML", "CSS"],
      site: "https://andreydpaula.github.io/landing-pagename/",
      repo: "https://github.com/andreydpaula/landing-pagename"
    }
    // Adicione mais projetos copiando o bloco acima (separe com vírgula).
  ],
  experience: [
    // { role: "Cargo", company: "Empresa", period: "2023 — Atual", description: "Resumo das entregas." }
  ]
};
/* ================================================================================ */

const LANGS = {
  HTML:{c:"#ff7a45",g:"</>"}, CSS:{c:"#4f8cff",g:"{ }"}, JavaScript:{c:"#f2d14b",g:"JS"}, TypeScript:{c:"#4a90e2",g:"TS"},
  Python:{c:"#59c3a5",g:"py"}, SQL:{c:"#e8a33d",g:"SQL"}, Java:{c:"#e5705a",g:"Jv"}, Go:{c:"#4dc9e6",g:"Go"}, R:{c:"#6f9bd6",g:"R"}
};
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const C = CONFIG;

document.title = C.name + " — Portfólio";
$("#brand").innerHTML = esc(C.name.split(" ")[0]) + "<i>.</i>";
$("#role").textContent = C.role;
$("#name").textContent = C.name;
$("#summary").textContent = C.summary;
["#b-in","#f-in"].forEach(s => $(s).href = C.linkedin);
["#b-gh","#f-gh"].forEach(s => $(s).href = C.github);
if (C.email) { $("#f-mail").href = "mailto:" + C.email; $("#f-mail").hidden = false; }
$("#copy").textContent = "© " + new Date().getFullYear() + " " + C.name;

$("#about").innerHTML = C.about.map(p => "<p>" + esc(p) + "</p>").join("");
$("#skills").innerHTML = C.skills.map(s => '<span class="tag">' + esc(s) + "</span>").join("");
if (!C.about.length && !C.skills.length) hide("sobre");

const arrow = '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg>';
$("#projects").innerHTML = C.projects.map(p => {
  const l = LANGS[p.lang] || {c:"#5eead4", g:"#"};
  return '<article class="card rv" style="--lc:' + l.c + '"><div class="cover"><em>' + esc(p.lang) + '</em><b>' + esc(l.g) + '</b></div>' +
    '<div class="cbody"><h3>' + esc(p.name) + '</h3><p>' + esc(p.description) + '</p>' +
    '<div class="stack">' + p.stack.map(t => "<span>" + esc(t) + "</span>").join("") + '</div>' +
    '<div class="clinks">' + (p.repo ? '<a href="' + esc(p.repo) + '" target="_blank" rel="noopener">Repositório ' + arrow + '</a>' : "") +
    (p.site ? '<a href="' + esc(p.site) + '" target="_blank" rel="noopener">Ver online ' + arrow + '</a>' : "") + '</div></div></article>';
}).join("");

$("#jobs").innerHTML = C.experience.map(j => '<div class="job rv"><small>' + esc(j.period) + '</small><h3>' + esc(j.role) +
  '</h3><div class="co">' + esc(j.company) + '</div><p>' + esc(j.description || "") + '</p></div>').join("");
if (!C.experience.length) hide("experiencia");

function hide(id) { $("#" + id).hidden = true; const a = document.querySelector('[data-s="' + id + '"]'); if (a) a.hidden = true; }

const nav = $("#nav");
const onScroll = () => nav.classList.toggle("scrolled", scrollY > 24);
addEventListener("scroll", onScroll, {passive:true}); onScroll();

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll(".rv").forEach((el, i) => { el.style.transitionDelay = (i % 4) * 70 + "ms"; io.observe(el); });
</script>
</body>
</html>
